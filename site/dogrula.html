<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sertifika doğrula | Barış Kılıçarslan Masterclass Akademi</title>
<meta name="robots" content="noindex">
<meta name="description" content="Masterclass Akademi sertifikalarını numarayla doğrulayın.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;background:#F4F4F1;color:#0B0B0C;font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#000;padding:22px clamp(18px,4vw,48px)}
header a{color:#fff;text-decoration:none;font:600 13px/1 Inter,sans-serif;letter-spacing:.32em}
main{flex:1;width:min(640px,100%);margin:0 auto;padding:clamp(36px,7vw,80px) 20px 60px}
h1{font:500 clamp(34px,6vw,48px)/1.02 "Inter Tight",Inter,sans-serif;letter-spacing:-.04em;margin:0 0 12px}
p.lead{margin:0 0 28px;color:#5E5E66}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;height:52px;padding:0 16px;border:1.5px solid #D3D3CD;border-radius:14px;background:#fff;font:500 17px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#0B0B0C}
input:focus{outline:none;border-color:#000}
button{height:52px;padding:0 24px;border:0;border-radius:999px;background:#000;color:#fff;font:600 15px/1 Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.res{margin-top:28px;border-radius:18px;background:#fff;padding:22px 24px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.res b.h{display:flex;align-items:center;gap:10px;font:600 18px/1.3 Inter,sans-serif;margin-bottom:14px}
.res b.h i{width:12px;height:12px;border-radius:50%;background:#1F9D55;flex:none}
.res.no b.h i{background:#E0262E}
.res.no{background:#FBE5E5}
dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px 18px;margin:0}
dt{color:#5E5E66;font-size:14px}
dd{margin:0;font-weight:500}
.res p{margin:0;color:#3A3A40}
footer{padding:24px 20px 32px;text-align:center;color:#8C8C94;font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<header><a href="/">BARIŞ KILIÇARSLAN</a></header>
<main>
  <h1>Sertifika doğrula</h1>
  <p class="lead">Masterclass Akademi sertifikasındaki numarayı yazın ya da sertifikadaki QR kodunu okutun.</p>
  <form id="f" autocomplete="off">
    <label for="no" style="position:absolute;left:-9999px">Sertifika numarası</label>
    <input id="no" name="no" placeholder="MA-26-XXXXXX" maxlength="20" required inputmode="text" autocapitalize="characters" spellcheck="false">
    <button id="b" type="submit">Doğrula</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<footer>Barış Kılıçarslan Masterclass Akademi · Sertifikalar yalnız akademinin sistemi tarafından numaralanır.</footer>
<script>
(function(){
  var SB_URL='https://xjbqesljonbbduldeesd.supabase.co',SB_KEY='sb_publishable_VaavFE-aieVC-vJJ7AA-Mg_k5RNSJNq';
  var KIND={kat:'Katılım Sertifikası',bas:'Başarı Sertifikası',mc:'Masterclass Akademi Sertifikası'};
  var AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var f=document.getElementById('f'),inp=document.getElementById('no'),b=document.getElementById('b'),out=document.getElementById('out');
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
  function date(s){var p=String(s).split('-');return +p[2]+' '+AY[+p[1]-1]+' '+p[0];}
  function show(ok,title,rows,note){
    out.textContent='';var box=el('div','res'+(ok?'':' no')),h=el('b','h');h.appendChild(el('i'));h.appendChild(document.createTextNode(title));box.appendChild(h);
    if(rows){var dl=el('dl');rows.forEach(function(r){dl.appendChild(el('dt',null,r[0]));dl.appendChild(el('dd',null,r[1]));});box.appendChild(dl);}
    if(note)box.appendChild(el('p',null,note));out.appendChild(box);
  }
  function check(no){
    no=String(no||'').trim().toUpperCase();if(!no)return;
    inp.value=no;b.disabled=true;out.textContent='';
    fetch(SB_URL+'/rest/v1/rpc/verify_certificate',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_no:no})})
      .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();})
      .then(function(L){
        var x=L&&L[0];
        if(!x)return show(false,'Bu numarayla sertifika bulunamadı',null,'Numarayı sertifikadakiyle karşılaştırın. Sorun sürerse sertifikayı veren ofisle görüşün.');
        var rows=[['Ad soyad',x.holder_name],['Sertifika',KIND[x.kind]||x.kind],['Eğitim',x.training_title||'Masterclass Akademi'],['Ofis',x.office_name],['Tarih',date(x.issued_on)],['Numara',x.no]];
        if(x.valid)show(true,'Geçerli sertifika',rows);else show(false,'Bu sertifika iptal edilmiş',rows);
      })
      .catch(function(){show(false,'Şu an doğrulanamadı',null,'Bağlantınızı kontrol edip tekrar deneyin.');})
      .then(function(){b.disabled=false;});
  }
  f.addEventListener('submit',function(e){e.preventDefault();check(inp.value);});
  var m=location.pathname.match(/\/dogrula\/([A-Za-z0-9-]+)/),q=new URLSearchParams(location.search).get('no');
  if(m)check(decodeURIComponent(m[1]));else if(q)check(q);
})();
</script>
</body>
</html>
