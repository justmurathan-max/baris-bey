# Supabase veritabanının şifreli gece yedeği.
#
# Depo sırları (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_DB_URL  Supabase > Connect > "Session pooler" bağlantı adresi, şifre yerine yazılmış hâliyle
#                    (GitHub'ın makineleri IPv6 bilmediği için doğrudan bağlantı adresi çalışmaz)
#   YEDEK_SIFRE      yedeği şifreleyen parola; en az 24 karakter, parola yöneticisinde de saklanır
#
# Her gece rolleri, şemayı ve veriyi (akademi hesapları dahil) alır, tek dosyada AES-256 ile şifreler ve
# çalıştırmanın "Artifacts" bölümüne koyar; 30 gün tutulur. Depo herkese açık olduğu için yedek şifrelenmeden
# hiçbir yere yazılmaz ve günlüklere veri yazılmaz. Belgeler kovasındaki PDF'ler bu yedekte değildir.
# Elle çalıştırırken "geri yükleme denemesi" seçilirse yedek geçici bir Supabase veritabanına yüklenip denenir.
# Geri yükleme adımları: README, "Veritabanı yedeği".
name: Veritabanı yedeği

on:
  schedule:
    - cron: '17 0 * * *' # her gece 03:17 (Türkiye saati)
  workflow_dispatch:
    inputs:
      geri_yukleme_denemesi:
        description: 'Yedeği geçici bir veritabanına yükleyerek dene'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veritabani-yedegi
  cancel-in-progress: false

env:
  SUPABASE_CLI: '3.4.0'

jobs:
  yedek:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ad: ${{ steps.sifrele.outputs.ad }}
    steps:
      - name: Sırları denetle
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          YEDEK_SIFRE: ${{ secrets.YEDEK_SIFRE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$YEDEK_SIFRE" ]; then
            echo "::error::SUPABASE_DB_URL ve YEDEK_SIFRE depo sırları eklenmemiş."; exit 1
          fi
          if [ "${#YEDEK_SIFRE}" -lt 24 ]; then
            echo "::error::YEDEK_SIFRE en az 24 karakter olmalı."; exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) ;;
            *) echo "::error::SUPABASE_DB_URL, Connect panelindeki Session pooler adresi olmalı."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yedek al
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/yedek" && cd "$RUNNER_TEMP/yedek"
          sb() { npx --yes "supabase@${SUPABASE_CLI}" "$@"; }
          sb db dump --remote="$SUPABASE_DB_URL" -f roles.sql --role-only
          sb db dump --remote="$SUPABASE_DB_URL" -f schema.sql
          sb db dump --remote="$SUPABASE_DB_URL" -f data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Dosyaları denetle
        working-directory: ${{ runner.temp }}/yedek
        run: |
          set -euo pipefail
          for f in roles.sql schema.sql data.sql; do
            [ -s "$f" ] || { echo "::error::$f boş."; exit 1; }
          done
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."site_requests"' schema.sql || { echo "::error::Şemada site_requests yok."; exit 1; }
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."profiles"' schema.sql || { echo "::error::Şemada profiles yok."; exit 1; }
          grep -q 'COPY "auth"."users"' data.sql || { echo "::error::Veride auth.users yok."; exit 1; }
          grep -q 'COPY "public"."offices"' data.sql || { echo "::error::Veride offices yok."; exit 1; }
          echo "Üç dosya da dolu, beklenen tablolar var."

      - name: Şifrele
        id: sifrele
        env:
          YEDEK_SIFRE: ${{ secrets.YEDEK_SIFRE }}
        working-directory: ${{ runner.temp }}/yedek
        run: |
          set -euo pipefail
          AD="yedek-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf - roles.sql schema.sql data.sql \
            | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$AD.tar.gz.gpg" 3<<<"$YEDEK_SIFRE"
          shred -u roles.sql schema.sql data.sql
          # Şifreli dosyanın aynı parolayla açıldığını ve üç dosyayı içerdiğini dene
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt "$AD.tar.gz.gpg" 3<<<"$YEDEK_SIFRE" | tar -tzf - | sort | tr '\n' ' '
          echo
          echo "ad=$AD" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sifrele.outputs.ad }}
          path: ${{ runner.temp }}/yedek/${{ steps.sifrele.outputs.ad }}.tar.gz.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  geri-yukleme-denemesi:
    needs: yedek
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.geri_yukleme_denemesi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.yedek.outputs.ad }}
          path: ${{ runner.temp }}/indir

      - name: Şifreyi çöz
        env:
          YEDEK_SIFRE: ${{ secrets.YEDEK_SIFRE }}
        working-directory: ${{ runner.temp }}/indir
        run: |
          set -euo pipefail
          umask 077
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt ./*.tar.gz.gpg 3<<<"$YEDEK_SIFRE" | tar -xzf -
          ls roles.sql schema.sql data.sql > /dev/null

      - name: Geçici Supabase veritabanını başlat
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yerel" && cd "$RUNNER_TEMP/yerel"
          npx --yes "supabase@${SUPABASE_CLI}" init
          npx --yes "supabase@${SUPABASE_CLI}" db start

      - name: Yedeği yükle
        working-directory: ${{ runner.temp }}/indir
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -q \
            --single-transaction --variable ON_ERROR_STOP=1 \
            --file roles.sql --file schema.sql \
            --command 'SET session_replication_role = replica' \
            --file data.sql > /dev/null
          # Her tablonun yedekteki satır sayısı yüklenen veritabanındakiyle aynı mı?
          # Sayılar herkese açık günlüğe yazılmaz; yalnız tutmayan tablonun adı yazılır.
          awk '/^COPY /{t=$2; n=0; ic=1; next} ic && /^\\\.$/{print t, n; ic=0; next} ic{n++}' data.sql > beklenen.txt
          [ -s beklenen.txt ] || { echo "::error::Yedekte veri bölümü bulunamadı."; exit 1; }
          tutmayan=0
          while read -r tablo sayi; do
            gercek=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tA -v ON_ERROR_STOP=1 -c "select count(*) from $tablo")
            if [ "$gercek" != "$sayi" ]; then echo "::error::Satır sayısı tutmuyor: $tablo"; tutmayan=$((tutmayan + 1)); fi
          done < beklenen.txt
          [ "$tutmayan" -eq 0 ] || exit 1
          echo "Yedek geçici veritabanına hatasız yüklendi; $(wc -l < beklenen.txt) tablonun satır sayısı yedekle aynı."

      - name: Temizle
        if: always()
        run: |
          cd "$RUNNER_TEMP/yerel" 2>/dev/null && npx --yes "supabase@${SUPABASE_CLI}" stop --no-backup || true
          rm -rf "$RUNNER_TEMP/indir"
